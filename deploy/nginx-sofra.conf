# Nginx site for Sofra. setup-server.sh replaces __DOMAIN__ and __APP_DIR__.
# HTTPS is added later by certbot (enable-https.sh), which edits this file.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __APP_DIR__/public;
    index index.php;
    charset utf-8;

    # Product photos are up to 10 MB (the app re-encodes them to WebP).
    client_max_body_size 12M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Versioned build files never change under the same name.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    # .env, .git and every other dotfile stay private (Let's Encrypt needs .well-known).
    location ~ /\.(?!well-known) {
        deny all;
    }
}
